      <section class="cta">

        <!-- Мотив маршрута с первого экрана, приглушённый до фона.
             Пунктир медленно ползёт вдоль линий — движение почти
             незаметное, но полоса перестаёт быть плоской. -->
        <div class="cta__art" aria-hidden="true">
          <svg viewBox="0 0 1200 460" preserveAspectRatio="xMidYMid slice"
               xmlns="http://www.w3.org/2000/svg" focusable="false">
            <path class="cta__line" d="M-40 372 C 210 330, 380 176, 720 140 C 950 116, 1080 70, 1240 40"
                  fill="none" stroke-width="2" stroke-linecap="round"
                  stroke-dasharray="5 13"/>
            <path class="cta__line cta__line--soft" d="M-40 424 C 260 404, 470 268, 830 228 C 1030 206, 1150 158, 1240 132"
                  fill="none" stroke-width="1.5" stroke-linecap="round"
                  stroke-dasharray="4 12"/>
          </svg>
        </div>

        <div class="container cta__inner" data-reveal="fade">

          <p class="badge">Ilkinji maslahat mugt</p>

          <h2 class="cta__title">{{title}}</h2>

          <p class="cta__text">{{text}}</p>

          <div class="cta__actions">
            <a class="btn btn--primary btn--lg" href="habarlasmak.html">Maslahat almak</a>
            <a class="btn btn--secondary btn--on-dark btn--lg" href="{{phoneHref}}">{{phone}}</a>
          </div>

        </div>
      </section>
