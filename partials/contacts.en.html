  <!--
    Тёмная панель со способами связи. Все данные берутся из data/site.json.
    Здесь править не надо: правьте data/site.json и запускайте
        node scripts/sync-layout.js

    Блоки в парных метках "if" и "endif" показываются, только когда поле
    заполнено. Пустое поле в site.json = блока на странице нет.
  -->

        <div class="contact-panel">

          <!-- Тот же мотив маршрута, что в блоке призыва, приглушённый до фона -->
          <div class="contact-panel__art" aria-hidden="true">
            <svg viewBox="0 0 1200 460" preserveAspectRatio="xMidYMid slice"
                 xmlns="http://www.w3.org/2000/svg" focusable="false">
              <path class="cta__line" d="M-40 372 C 210 330, 380 176, 720 140 C 950 116, 1080 70, 1240 40"
                    fill="none" stroke-width="2" stroke-linecap="round"
                    stroke-dasharray="5 13"/>
              <path class="cta__line cta__line--soft" d="M-40 424 C 260 404, 470 268, 830 228 C 1030 206, 1150 158, 1240 132"
                    fill="none" stroke-width="1.5" stroke-linecap="round"
                    stroke-dasharray="4 12"/>
            </svg>
          </div>

          <div class="contact-panel__inner">

            <h2 class="contact-panel__title">Call us</h2>
            <p class="contact-panel__note">The fastest way. During working hours we always answer.</p>

            <!-- Телефоны — главное на странице, поэтому и крупнее всего.
                 Сколько номеров в data/site.json, столько и покажется. -->
            <ul class="phones">
            <!-- for:phones -->
              <li><a class="phones__link" href="{{href}}">{{display}}</a></li>
            <!-- endfor -->
            </ul>

            <p class="contact-panel__subtitle">Write to us</p>

            <ul class="contact-lines">
              <li>
                <a class="contact-line" href="{{emailHref}}">
                  <svg class="icon contact-line__icon" aria-hidden="true"><use href="#i-mail"/></svg>
                  <span class="contact-line__label">Email</span>
                  <span class="contact-line__value">{{email}}</span>
                </a>
              </li>
            <!-- for:social -->
              <li>
                <a class="contact-line" href="{{url}}" target="_blank" rel="noopener">
                  <svg class="icon contact-line__icon" aria-hidden="true"><use href="#i-instagram"/></svg>
                  <span class="contact-line__label">{{label}}</span>
                  <span class="contact-line__value">{{value}}</span>
                </a>
              </li>
            <!-- endfor -->
            </ul>

            <!-- if:messengers -->
            <ul class="contact-lines">
            <!-- for:messengers -->
              <li>
                <span class="contact-line" data-form-url="{{formUrlSafe}}" data-messenger="{{label}}">
                  <svg class="icon contact-line__icon" aria-hidden="true"><use href="#i-message"/></svg>
                  <span class="contact-line__label">{{label}}</span>
                  <span class="contact-line__value">{{valueHtml}}</span>
                </span>
              </li>
            <!-- endfor -->
            </ul>
            <!-- endif -->

            <p class="contact-panel__foot">
              <span>Working hours: {{hoursHtml}}</span>
              <span>Languages: {{serviceLanguages}}</span>
            </p>

          </div>
        </div>
